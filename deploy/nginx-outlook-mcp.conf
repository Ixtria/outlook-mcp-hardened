# nginx reverse-proxy template for outlook-mcp-hardened.
#
# Install :
#   sudo cp nginx-outlook-mcp.conf /etc/nginx/sites-available/outlook-mcp
#   sudo ln -s /etc/nginx/sites-available/outlook-mcp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Get a TLS certificate first (recommended : certbot for Let's Encrypt) :
#   sudo certbot --nginx -d outlook-mcp.example.com
#
# This template assumes :
#   - outlook-mcp-hardened is running on 127.0.0.1:3000 (the systemd default)
#   - nginx is on the same host
#   - Let's Encrypt certificate is in /etc/letsencrypt/live/outlook-mcp.example.com/
#
# If nginx is on a separate host, you MUST :
#   - replace `127.0.0.1` with the outlook-mcp host's IP
#   - bind outlook-mcp-hardened to that host's interface (NOT 0.0.0.0)
#   - set OUTLOOK_MCP_TRUSTED_PROXIES on outlook-mcp to nginx's outbound IP

# ─────────────────────────────────────────────────────────────────────────
# Rate limiting zones (apply per-IP at the reverse proxy level)
# ─────────────────────────────────────────────────────────────────────────

# OAuth endpoints — more restrictive (anti DoS on /authorize state-flood
# vector even though the app has its own bounded pkceStore).
limit_req_zone $binary_remote_addr zone=outlook_oauth:10m rate=10r/s;

# /mcp endpoint — looser, real workload.
limit_req_zone $binary_remote_addr zone=outlook_mcp:10m rate=20r/s;

# ─────────────────────────────────────────────────────────────────────────
# HTTPS server
# ─────────────────────────────────────────────────────────────────────────

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name outlook-mcp.example.com;

    # TLS (Let's Encrypt managed by certbot)
    ssl_certificate     /etc/letsencrypt/live/outlook-mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/outlook-mcp.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!MD5:!DSS;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:ssl_outlook:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    # ─────────────────────────────────────────────────────────────────────
    # Security headers
    # ─────────────────────────────────────────────────────────────────────

    # HSTS — 1 year. Once you're sure of the deployment, add `preload` and
    # submit to https://hstspreload.org/.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Discovery + OAuth endpoints return JSON ; the LLM front-end doesn't
    # render arbitrary HTML from this domain. CSP is strict default-deny.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Hide nginx version
    server_tokens off;

    # ─────────────────────────────────────────────────────────────────────
    # Request size limit
    # ─────────────────────────────────────────────────────────────────────

    # OAuth + MCP requests are tiny. App-level limit is 10kb ; nginx adds
    # a hard ceiling.
    client_max_body_size 32k;
    client_body_buffer_size 16k;

    # Slowloris defenses
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          30s;

    # ─────────────────────────────────────────────────────────────────────
    # MCP Streamable HTTP endpoint
    # ─────────────────────────────────────────────────────────────────────

    location /mcp {
        limit_req zone=outlook_mcp burst=10 nodelay;

        proxy_pass http://127.0.0.1:3000;

        # Trust-proxy headers : APPEND the real client IP (the outlook-mcp
        # app reads XFF rightmost-but-skipping-trusted). NEVER trust XFF
        # set by the client itself.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Streamable HTTP can stream Server-Sent Events ; disable buffering.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Long-lived streaming requests
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ─────────────────────────────────────────────────────────────────────
    # OAuth endpoints (discovery + authorize + token + register)
    # ─────────────────────────────────────────────────────────────────────

    location ~ ^/(authorize|token|register|\.well-known/oauth-) {
        limit_req zone=outlook_oauth burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # ─────────────────────────────────────────────────────────────────────
    # Health check (returns "Microsoft 365 MCP Server is running")
    # ─────────────────────────────────────────────────────────────────────

    location = / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        access_log off;
    }

    # ─────────────────────────────────────────────────────────────────────
    # security.txt (RFC 9116) — responsible disclosure discovery
    # ─────────────────────────────────────────────────────────────────────
    #
    # Serve the static file shipped in this repo at deploy/security.txt.
    # Adjust `alias` to the absolute path where you installed the file, e.g.:
    #   sudo install -o root -g root -m 0644 deploy/security.txt \
    #     /var/www/outlook-mcp/.well-known/security.txt
    #
    # The file MUST match the `Canonical:` URL declared inside it, otherwise
    # RFC 9116 parsers will reject it.

    location = /.well-known/security.txt {
        alias /var/www/outlook-mcp/.well-known/security.txt;
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8" always;
        access_log off;
    }

    # Block everything else
    location / {
        return 404;
    }

    # ─────────────────────────────────────────────────────────────────────
    # Logging
    # ─────────────────────────────────────────────────────────────────────

    access_log /var/log/nginx/outlook-mcp.access.log;
    error_log  /var/log/nginx/outlook-mcp.error.log warn;
}

# ─────────────────────────────────────────────────────────────────────────
# HTTP → HTTPS redirect (certbot will add this automatically too)
# ─────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name outlook-mcp.example.com;
    return 301 https://$host$request_uri;
}
