name: CI

on:
  push:
    branches: [main, 'hardening/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      # HARDENED: StepSecurity harden-runner in audit mode (observe egress
      # from GitHub-hosted runners). Switch to `egress-policy: block` with
      # an explicit allowlist after ~2 weeks of audit logs if Jimmy confirms.
      # HARDENED (SEC-05): pinned to SHA — floating tag freezes to this commit.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install deps (locked)
        run: npm ci

      - name: Generate Graph client from filtered endpoints
        run: npm run generate

      - name: Lint
        run: npm run lint

      - name: Typecheck (strict, noUncheckedIndexedAccess)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # HARDENED: block CI on any moderate-or-above dependency vulnerability
  # in production deps. Dev-dep advisories are reported but non-blocking.
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      # HARDENED: StepSecurity harden-runner in audit mode (observe egress
      # from GitHub-hosted runners). Switch to `egress-policy: block` with
      # an explicit allowlist after ~2 weeks of audit logs if Jimmy confirms.
      # HARDENED (SEC-05): pinned to SHA — floating tag freezes to this commit.
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: npm audit (production deps, moderate+ blocks)
        run: npm audit --audit-level=moderate --omit=dev
      - name: npm audit (all deps, advisory)
        continue-on-error: true
        run: npm audit --audit-level=moderate
